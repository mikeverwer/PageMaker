<!-- 
  Any HTML that the app requires should go in this file.
  All the content in this file will get injected into the #app-container div
-->

<div id="golden-rectangle-app" class="gr-app">
  <h2>Golden Rectangle</h2>
  <div class="gr-controls">
    <button id="gr-reset" type="button">Reset</button>
    <span id="gr-count" class="gr-count">Subdivisions: 0</span>
  </div>
  <svg id="gr-svg" viewBox="0 0 600 371" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Golden rectangle subdivider"></svg>
  <p class="gr-hint">Click the rectangle to slice off the next golden section.</p>
</div>
