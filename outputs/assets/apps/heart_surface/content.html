
<div id="heart-surface-app" class="heart-surface-app" data-state="equation">
  <button
    type="button"
    id="heart-surface-toggle"
    class="heart-surface-toggle"
    aria-expanded="false"
    aria-controls="heart-surface-plot"
    aria-label="Reveal an interactive 3D render of this surface"
  >
    <span class="heart-surface-eq">
      \[
      \left(2x^{2}+y^{2}+z^{2}-1\right)^{3} - \frac{x^{2}z^{3}}{10} - y^{2}z^{3} = 0
      \]
    </span>
  </button>

  <div id="heart-surface-plot" class="heart-surface-plot">
    <button
      type="button"
      id="heart-surface-back"
      class="heart-surface-back"
      aria-label="Back to equation"
    >&times;</button>
  </div>
</div>
